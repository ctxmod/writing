description: >-
  The doctrine shared by offers, project descriptions, and
  agreements: the first page gives the frame for the decision, each
  part opens with its own frame, references between documents, lists,
  the three-part price test, headings, register, and the appendix
  rule that sends detail the decision does not need to a named
  appendix sub-section or out. A document template decides the order
  of parts, page breaks, and furniture, never the voice: a template
  structure that prescribes a voice form the anti-pattern catalogue
  fails (definitions in contrast form, declarative insight bullets,
  label-led bullets, question-headed entries) keeps its order and
  furniture, and the text inside it is written to this profile.
binds_to_depth: main...
