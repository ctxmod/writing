description: >-
  What changes per kind of commercial document: the offer (a
  one-page, invoice-like document with appendices for price and terms
  and acceptance as a term), the project description (goal, strategy,
  work packages, deliveries and acceptance; price-free, never
  pointing to the offer), and the agreement (defined terms,
  obligations stated once, order of precedence, no sales register).
