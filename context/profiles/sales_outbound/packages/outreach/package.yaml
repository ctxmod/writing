description: >-
  Sales outbound writing: a sales message asks a recipient who owes
  the sender nothing to judge whether a commercial next step makes
  sense for them. The sales application of the message doctrine, the
  outbound working order with information selection and scaffold use,
  the cold first contact with the consolidated cold-email craft,
  replies and follow-up, introductions and the referral ask, calls,
  meetings and spoken drafts, credibility, offers and price, and the
  sales additions to the pre-send checks.
binds_to_depth: main...
