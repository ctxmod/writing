description: >-
  Word choice, economy, voice, tone, and register: the sentence-level
  craft that every other writing package builds on — plain words
  and precise diction (be as specific as the claim requires), the ISO
  24495 plain language standard, cutting padding and restatement, one
  voice at varying density in the stating register, no colon joining
  clauses in running prose, and the tests-not-bans authoring principle.
