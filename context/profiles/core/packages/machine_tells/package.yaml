description: >-
  Machine tells: why text that reads as machine-generated fails its
  readers (the evidence on AI-mediated communication, suspicion and
  sincerity penalties, disclosure, workslop, the effort heuristic and
  lost signalling value, and why human detection is unreliable), and a
  catalogue of tells written as tests with narrow exceptions — stock
  vocabulary, service frames, summary closes, hedge fog, vague
  attribution, abstraction, default formatting, uniform rhythm,
  interchangeable text, performed feeling, and drafting residue — with
  the contested and ineffective indicators named. The repair is
  substance and ownership, never camouflage.
binds_to_depth: main...
