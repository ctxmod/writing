description: >-
  Reader empathy: every text is written for a named reader, so the
  writer models who that reader is, what they already know, what they
  need to do, decide or feel after reading, and how much attention
  they will give it. The curse of knowledge and its two-sided repair,
  reading behavior and the cost of the reader's time, sentence-level
  reader expectations, specificity as the evidence of attention, and
  making the reader feel seen without flattery or presumed feelings.
binds_to_depth: main...
