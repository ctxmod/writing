description: >-
  Author integrity: the author stands behind every sentence, writes
  from what they actually know, did and believe, places uncertainty
  where it is, keeps one voice they own, and earns warmth through real
  relationship and specifics instead of borrowed experience or fake
  intimacy. Assistance from tools and people leaves ownership with the
  author; disclosure of assistance follows binding policy first, then
  the reader's reasonable expectations, and a statement about how a
  text was produced is never false.
binds_to_depth: main...
