description: >-
  The anti-pattern catalogue: eleven patterns that lower a text's
  quality, each written as a test with a counter-example, a rewrite,
  and a narrow exception — lists, bold mini-headings, choppy salesy
  lines, contrast for effect, meta statements, misplaced detail,
  repetition, order of emphasis, question headings,
  content-declaration openings, and hand-holding.
binds_to_depth: main...
