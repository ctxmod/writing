title: Writing Core
description: >-
  Shared base for every writing profile: craft fundamentals, the
  whole-to-detail model with its review test and reader order, the
  claims-and-evidence doctrine, reader empathy, author integrity, the
  anti-pattern catalogue and the machine-tell catalogue written as
  tests with narrow exceptions, the standing quality gate for outward
  prose with its reader pass, document structure, and mechanics shared
  by both major English dialects. Every other writing profile extends this one, and every
  rule holds for all writing regardless of language or genre.
packages:
  defaults:
    - basics
    - structure
    - mechanics
    - whole_to_detail
    - claims
    - reader
    - integrity
    - anti_patterns
    - machine_tells
    - process
