description: >-
  Argument in essays, analyses, criticism, and proposals: an essay
  argues a claim to a reader who may disagree, so the argument is the
  frame — the opening states what the text will defend, each
  section advances that defence, and the ending, title, and
  standfirst claim only what the body has earned. Argumentation
  (contesting another author's actual claim, fair tests, the
  resisting case, kinds of judgment, scoped norms), working with
  sources (origins over publication counts, attribution, conflicting
  sources, degrees of confidence, the narrower causal claim), and the
  essay's genre principles.
binds_to_depth: main...
