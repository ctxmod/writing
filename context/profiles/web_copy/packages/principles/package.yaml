description: >-
  Web copy doctrine: web copy is read in passing by someone deciding
  whether the work described is relevant to them, so the page is the
  unit — the opening says what the work actually is, the
  buzzword-lead test, each claim stated once per page, the stating
  register, generic copy and the competitor-swap test, and the
  external-terminology exception for headers.
