description: >-
  The message doctrine every message shares: a message is read by one
  recipient deciding what, if anything, to do next, so it applies the
  whole-to-detail model at message scale — the motivated next step,
  information chosen before words, the opening that carries what
  matters most to the recipient, information order decided per
  message, the actual relationship, precision about what is known,
  the recipient's control, and the working order from intent to
  outcome; plus the pre-send checks (hard stops, checklist,
  interchangeability, forwarding and answer-cost tests, the final
  control question).
binds_to_depth: main...
