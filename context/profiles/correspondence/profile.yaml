extends:
  - github.com/ctxmod/writing/context/profiles/core
title: Writing — Correspondence
description: >-
  Email, letter, memo, and message writing, including replies in ongoing
  threads and answers to posed questions (form fields, screening
  questions): every message aims at a motivated next step, information
  is chosen before words, the first sentence carries what matters most
  to the recipient, information order is decided per message, the
  recipient keeps control, a reply answers what was actually written, an
  answer matches the size of the question, and a pre-send pass checks
  grounds, forwarding, and answer cost. Also subject lines, explicit
  asks, scannable structure, and register tiers. Sales outreach builds
  on this profile in sales_outbound. Swedish conventions live in the
  writing_sv module's korrespondens profile.
packages:
  add:
    - forms
    - message_doctrine
    - replies
    - application_answers
