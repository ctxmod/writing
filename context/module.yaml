title: Writing
description: >-
  General English writing doctrine: craft fundamentals, the
  whole-to-detail model and its review test, the claims-and-evidence
  doctrine, the anti-pattern catalogue, the standing quality gate,
  document structure, shared mechanics, British and American English
  surface conventions, and writing-type guidance for correspondence,
  sales outbound, commercial documents, job applications, translation,
  web copy, technical documentation, specifications, and prose.
  Consumers select the core by default, one dialect profile for surface
  conformance, and any writing-type profiles for the task at hand.
path: github.com/ctxmod/writing/context
default_profiles:
  - core
